nodeMetadata: {}
stableNames: true
jitter:
  workloads: "10s"
  config: "0s"
namespaces:
- name: mesh
  # 100 replicas: 30k pods, 2k services
  # 666 replicas: 200k pods, 13.3k services
  # replicas: 666
  replicas: 100
  # 300 pods, 20 services
  applications:
  - name: big
    replicas: 1
    pods: 20
    type: ambient # No sidecar needed
    labels:
      istio.io/global: "true"
  - name: med
    replicas: 1
    pods: 10
    type: ambient # No sidecar needed
    labels:
      istio.io/global: "true"
  - name: small
    replicas: 1
    pods: 10
    type: ambient # No sidecar needed
    labels:
      istio.io/global: "true"
nodes:
- name: node
  count: 15
  ztunnel: {}
